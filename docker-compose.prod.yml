services:
  db:
    image: mariadb:11
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Ustaw MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-ems}
      MYSQL_USER: ${MYSQL_USER:-ems_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Ustaw MYSQL_PASSWORD}
    volumes:
      - mariadb_prod_data:/var/lib/mysql
    networks:
      - backend
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    restart: unless-stopped

  mongo:
    image: mongo:7
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:?Ustaw MONGO_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?Ustaw MONGO_ROOT_PASSWORD}
      MONGO_DATABASE: ${MONGO_DATABASE:-ems}
      MONGO_APP_USERNAME: ${MONGO_APP_USERNAME:?Ustaw MONGO_APP_USERNAME}
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD:?Ustaw MONGO_APP_PASSWORD}
    volumes:
      - mongo_prod_data:/data/db
      - ./deploy/mongo-init.js:/docker-entrypoint-initdb.d/10-app-user.js:ro
    networks:
      - backend
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mongosh --quiet
          --username "$$MONGO_INITDB_ROOT_USERNAME"
          --password "$$MONGO_INITDB_ROOT_PASSWORD"
          --authenticationDatabase admin
          --eval "db.adminCommand('ping')"
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    restart: unless-stopped

  migrate:
    build: .
    environment: &app-environment
      SECRET_KEY: ${SECRET_KEY:?Ustaw SECRET_KEY}
      DATABASE_URL: >-
        mysql+pymysql://${MYSQL_USER:-ems_user}:${MYSQL_PASSWORD_URI:?Ustaw MYSQL_PASSWORD_URI}@db:3306/${MYSQL_DATABASE:-ems}?charset=utf8mb4
      MONGO_URL: >-
        mongodb://${MONGO_APP_USERNAME}:${MONGO_APP_PASSWORD_URI:?Ustaw MONGO_APP_PASSWORD_URI}@mongo:27017/${MONGO_DATABASE:-ems}?authSource=${MONGO_DATABASE:-ems}
      FLASK_HOST: 0.0.0.0
      FLASK_PORT: "5000"
      FLASK_DEBUG: "false"
      DEBUG_LOGIN_BUTTONS: "false"
      SESSION_COOKIE_SECURE: "true"
      TRUST_PROXY_HEADERS: "true"
      ENABLE_HSTS: "true"
      JSON_LOGS: "true"
      MS_CLIENT_ID: ${MS_CLIENT_ID:?Ustaw MS_CLIENT_ID}
      MS_CLIENT_SECRET: ${MS_CLIENT_SECRET:?Ustaw MS_CLIENT_SECRET}
      MS_TENANT_ID: ${MS_TENANT_ID:?Ustaw MS_TENANT_ID}
      MS_REDIRECT_URI: ${MS_REDIRECT_URI:?Ustaw MS_REDIRECT_URI}
      MS_ALLOWED_EMAIL_DOMAINS: ${MS_ALLOWED_EMAIL_DOMAINS:?Ustaw MS_ALLOWED_EMAIL_DOMAINS}
    command: ["flask", "--app", "app", "db", "upgrade"]
    networks:
      - backend
    depends_on:
      db:
        condition: service_healthy
      mongo:
        condition: service_healthy
    restart: "no"

  flask:
    build: .
    environment: *app-environment
    volumes:
      - app_prod_data:/app/data
    networks:
      - frontend
      - backend
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://localhost:5000/health/ready', timeout=3)
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  retention:
    build: .
    environment:
      <<: *app-environment
      RETENTION_INTERVAL_SECONDS: ${RETENTION_INTERVAL_SECONDS:-86400}
    volumes:
      - app_prod_data:/app/data
    command:
      - sh
      - -c
      - >-
        while true; do
        python -m core.retention_job;
        sleep "$$RETENTION_INTERVAL_SECONDS";
        done
    networks:
      - backend
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/certs:/etc/nginx/certs:ro
    networks:
      - frontend
    depends_on:
      flask:
        condition: service_healthy
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.55.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/alert-rules.yml:/etc/prometheus/alert-rules.yml:ro
      - prometheus_prod_data:/prometheus
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    networks:
      - backend
    depends_on:
      flask:
        condition: service_healthy
    restart: unless-stopped

networks:
  frontend:
  backend:
    internal: true

volumes:
  mariadb_prod_data:
  mongo_prod_data:
  app_prod_data:
  prometheus_prod_data:

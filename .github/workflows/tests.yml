name: tests

on:
  push:
  pull_request:

jobs:
  unit-and-migrations:
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: ci-secret-key-with-at-least-32-characters
      DATABASE_URL: sqlite:////tmp/flask-app-form-ci.db
      MONGO_URL: mongodb://localhost:27017/ci
      SESSION_COOKIE_SECURE: "false"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: flask --app app db upgrade
      - run: flask --app app db check

  browser-e2e:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build E2E environment
        run: docker compose -f docker-compose.e2e.yml build

      - name: Run browser tests
        run: >-
          docker compose -f docker-compose.e2e.yml
          up --abort-on-container-exit --exit-code-from e2e e2e

      - name: Show application logs after failure
        if: failure()
        run: docker compose -f docker-compose.e2e.yml logs flask-e2e mongo-e2e

      - name: Upload UI test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-evidence
          path: |
            documentation/testy-ui/screenshots
            documentation/testy-pdf
          if-no-files-found: warn

      - name: Remove E2E environment
        if: always()
        run: docker compose -f docker-compose.e2e.yml down --volumes

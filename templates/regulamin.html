{% extends "base.html" %}
{% block title %}Regulamin praktyk zawodowych{% endblock %}

{% block content %}
<div class="page regulation-page">
    <div class="page-top">
        <div>
            <h1>Regulamin praktyki zawodowej</h1>
        </div>
    </div>

    <section class="pdf-reader" aria-label="Regulamin praktyki zawodowej">
        <iframe id="pdf-iframe"
            src="{{ url_for('regulamin_pdf') }}#view=FitH&toolbar=1&navpanes=0"
            title="Regulamin praktyki zawodowej w formacie PDF">
        </iframe>
        <p class="pdf-reader-fallback" id="pdf-fallback" style="display:none">
            Przeglądarka nie obsługuje osadzonego PDF.
            <a href="{{ url_for('regulamin_pdf') }}">Otwórz dokument</a>.
        </p>
    </section>
    <script>
        (function () {
            var iframe = document.getElementById('pdf-iframe');
            iframe.addEventListener('error', function () {
                iframe.style.display = 'none';
                document.getElementById('pdf-fallback').style.display = '';
            });
        })();
    </script>
</div>
{% endblock %}
